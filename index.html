<title>AweLabs - AI-ассистент ПТО (демо)</title>
<meta name="description" content="Демо AweLabs: AI-ассистент инженера ПТО собирает раздел исполнительной документации. Выдуманные данные.">
<meta name="theme-color" content="#0a0a0b">
<meta name="robots" content="noindex">

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Unbounded:wght@400;600&family=Mulish:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0b;--bg2:#0d120e;--bg3:#121a14;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);--text:#e8f0e8;--muted:#7a857c;--g:#00ff41;--g2:#00b82e;--warn:#e8c45a;
--head:'Unbounded',sans-serif;--body:'Mulish',sans-serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-weight:400;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at 50% 0%,#000 20%,transparent 70%);opacity:.6}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono{font-family:var(--mono)}

.app{position:relative;display:grid;grid-template-rows:auto auto 1fr;height:100vh;max-width:1400px;margin:0 auto;padding:0 20px 20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px;border-bottom:1px solid var(--line)}
.logo{font:700 18px var(--mono);display:flex;align-items:center}
.logo .u{color:var(--g)}
.cur{display:inline-block;width:.55em;height:1.05em;background:var(--g);margin-left:4px;box-shadow:0 0 10px rgba(0,255,65,.5);animation:bl 1.05s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.ttl{font:12px var(--mono);color:var(--muted);display:flex;align-items:center;gap:10px}
.ttl b{color:var(--text);font-weight:500}
.pill{border:1px solid rgba(0,255,65,.35);color:var(--g);border-radius:999px;padding:3px 10px;font:11px var(--mono)}
.right{display:flex;align-items:center;gap:10px}
.lang{display:flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden}
.lang button{color:var(--muted);font:500 12px var(--mono);padding:6px 12px}
.lang button.on{background:var(--g);color:var(--bg)}
.back{font:12px var(--mono);color:var(--muted)}.back:hover{color:var(--g)}

.note{margin:14px 0;padding:10px 14px;border:1px dashed var(--line2);border-radius:10px;font:12px var(--mono);color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.note b{color:var(--text);font-weight:500}

.main{display:grid;grid-template-columns:240px 1fr 420px;gap:16px;min-height:0}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:16px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.ph{padding:14px 16px;border-bottom:1px solid var(--line);font:12px var(--mono);color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}

/* sidebar */
.side{padding:16px;gap:18px;overflow:auto}
.side h4{font:11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.obj{padding:12px;border:1px solid var(--line2);border-radius:12px;background:var(--bg)}
.obj b{display:block;font-family:var(--head);font-weight:400;font-size:14px}
.obj span{font-size:12.5px;color:var(--muted)}
.secs{list-style:none;display:flex;flex-direction:column;gap:4px}
.secs li{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:9px;font-size:13.5px;color:var(--muted)}
.secs li.act{background:rgba(0,255,65,.07);color:var(--text);border:1px solid rgba(0,255,65,.2)}
.secs li i{font-style:normal;font:11px var(--mono)}
.secs li.act i{color:var(--g)}
.who{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.who div{display:flex;justify-content:space-between}
.who b{color:var(--text);font-weight:500}

/* chat */
.chat{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.m{max-width:88%;padding:12px 15px;border-radius:14px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.m.u{align-self:flex-end;background:var(--bg3);border:1px solid var(--line2);border-bottom-right-radius:4px}
.m.a{background:rgba(0,255,65,.05);border:1px solid rgba(0,255,65,.2);border-bottom-left-radius:4px}
.m small{display:block;font:11px var(--mono);color:var(--muted);margin-bottom:4px}
.m.a small{color:var(--g)}
.m .att{display:inline-flex;gap:6px;align-items:center;margin-top:8px;padding:5px 10px;border:1px solid var(--line2);border-radius:8px;font:12px var(--mono);color:var(--muted)}
.plan{list-style:none;margin-top:8px;display:flex;flex-direction:column;gap:5px;font-size:14px}
.plan li{display:flex;gap:10px;align-items:center;color:var(--muted)}
.plan li::before{content:"○";font-family:var(--mono);width:14px;color:var(--muted)}
.plan li.run{color:var(--text)}.plan li.run::before{content:"◌";color:var(--g);animation:spin 1s linear infinite;display:inline-block}
.plan li.ok{color:var(--text)}.plan li.ok::before{content:"✓";color:var(--g)}
@keyframes spin{to{transform:rotate(360deg)}}
.q{border-color:rgba(232,196,90,.35);background:rgba(232,196,90,.05)}
.q small{color:var(--warn)!important}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opts button{text-align:left;padding:10px 14px;border:1px solid var(--line2);border-radius:10px;background:var(--bg);font-size:14px;transition:.2s}
.opts button:hover{border-color:var(--g);color:var(--g)}
.opts button.pick{border-color:var(--g);background:rgba(0,255,65,.1);color:var(--g)}
.opts button:disabled{cursor:default}
.opts button:disabled:not(.pick){opacity:.4}
.hint{font:11px var(--mono);color:var(--muted);margin-top:8px}
.typing{display:flex;gap:4px;padding:12px 14px;width:max-content;border-radius:14px;background:rgba(0,255,65,.05);border:1px solid rgba(0,255,65,.18)}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--g);animation:dot 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.25}30%{opacity:1}}
.inp{border-top:1px solid var(--line);padding:12px;display:flex;gap:10px;align-items:center}
.inp .f{flex:1;padding:12px 14px;border:1px solid var(--line2);border-radius:12px;background:var(--bg);color:var(--muted);font-size:14px;min-height:46px;display:flex;align-items:center}
.go{padding:12px 18px;border-radius:12px;background:var(--g);color:var(--bg);font-weight:600;font-size:14px;white-space:nowrap;transition:.2s}
.go:hover{box-shadow:0 0 0 4px rgba(0,255,65,.15),0 0 24px rgba(0,255,65,.3)}
.go:disabled{opacity:.4;box-shadow:none;cursor:default}

.timer{display:flex;align-items:center;gap:8px}
.timer .bar{width:80px;height:4px;border-radius:2px;background:var(--bg3);overflow:hidden}
.timer .bar i{display:block;height:100%;width:0;background:var(--g);transition:width .5s}

/* right panel */
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{padding:12px 14px;font:12px var(--mono);color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;position:relative}
.tabs button.on{color:var(--g);border-bottom-color:var(--g)}
.tabs button .dot{position:absolute;top:9px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--g);display:none}
.tabs button.new .dot{display:block}
.tb{flex:1;overflow:auto;padding:18px;display:none}
.tb.on{display:block}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:40px 10px}
.empty span{display:block;font:22px var(--mono);color:var(--line2);margin-bottom:8px}

.sum{padding:14px;border:1px solid rgba(0,255,65,.25);background:rgba(0,255,65,.05);border-radius:12px;margin-bottom:14px;font-size:14.5px}
.sum b{color:var(--g)}
.sum mark{background:none;color:var(--warn);font-weight:600}
details{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--bg)}
summary{padding:12px 14px;cursor:pointer;font-size:14px;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--mono);color:var(--muted)}
details[open] summary::after{content:"−"}
summary i{font-style:normal;font:11px var(--mono);color:var(--muted);margin-left:auto;margin-right:12px}
.dt{padding:0 14px 12px;font-size:13.5px;color:var(--muted)}
.dt table{width:100%;border-collapse:collapse;font-size:12.5px}
.dt td{padding:6px 4px;border-top:1px solid var(--line)}
.dt td:last-child{text-align:right;font-family:var(--mono)}
.okc{color:var(--g)}.wc{color:var(--warn)}

.file{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--bg);animation:in .35s}
.file .ic{width:36px;height:42px;border:1px solid var(--line2);border-radius:6px;display:grid;place-items:center;font:600 10px var(--mono);color:var(--g)}
.file b{display:block;font-size:13.5px;font-weight:500;overflow-wrap:anywhere}
.file span{font:11px var(--mono);color:var(--muted)}
.file .ok{font:11px var(--mono);color:var(--g)}
.dlv{margin-top:12px;border:1px solid rgba(0,255,65,.3);border-radius:12px;background:var(--bg);overflow:hidden}
.dlv .hd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600;color:var(--g)}
.dlv .hd i{width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 8px var(--g)}
.dlv .pth{padding:10px 14px;font:12.5px var(--mono);color:var(--text);background:rgba(0,255,65,.04);border-bottom:1px solid var(--line);word-break:break-all}
.dlv .pth span{color:var(--muted)}
.dlv ul{list-style:none;padding:8px 14px}
.dlv li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:13px}
.dlv li span{font:11px var(--mono);color:var(--muted);white-space:nowrap}
.dlv li b{font-weight:500;overflow-wrap:anywhere}
.dlv li b::before{content:"✓ ";color:var(--g)}
.dlv .act{display:flex;gap:8px;padding:0 14px 14px;flex-wrap:wrap}
.dlv .act button{padding:8px 14px;border-radius:9px;font-size:13px;border:1px solid var(--line2)}
.dlv .act button.p{background:var(--g);color:var(--bg);border-color:var(--g);font-weight:600}
.pathbar{font:12px var(--mono);color:var(--text);padding:10px 12px;border:1px solid rgba(0,255,65,.25);border-radius:10px;margin-bottom:12px;background:rgba(0,255,65,.04);word-break:break-all}
.pathbar span{color:var(--muted)}
.arch{display:block;text-align:center;padding:10px;border:1px dashed var(--line2);border-radius:10px;font:12px var(--mono);color:var(--muted);margin-top:4px}

.log{list-style:none;position:relative;padding-left:18px}
.log::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:1px;background:var(--line2)}
.log li{position:relative;margin-bottom:16px;animation:in .35s}
.log li::before{content:"";position:absolute;left:-18px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:1px solid var(--g2)}
.log li.nw::before{background:var(--g);box-shadow:0 0 8px var(--g)}
.log time{font:11px var(--mono);color:var(--muted)}
.log p{font-size:13.5px}

.dwg{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);margin-bottom:12px}
.dwg h5{font:11px var(--mono);color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
.dwg svg{width:100%;height:auto;display:block}
.dwg ul{list-style:none;margin-top:10px;font-size:12.5px;color:var(--muted)}
.dwg ul li::before{content:"✓ ";color:var(--g)}

.foot{position:fixed;left:0;right:0;bottom:0;pointer-events:none}

@media(max-width:1180px){.main{grid-template-columns:1fr 380px}.side{display:none}}
@media(max-width:820px){
  .app{height:auto;min-height:100vh}
  .main{grid-template-columns:1fr}
  .chatp{height:70vh}
  .rp{height:80vh}
  .ttl .hide{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
